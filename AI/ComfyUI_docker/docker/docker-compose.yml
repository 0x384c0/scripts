services:
  comfyui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: comfyui-cuda:latest
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      - ../ComfyUI:/app
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

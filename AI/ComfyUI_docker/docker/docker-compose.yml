services:
  comfyui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: comfyui-cuda:latest
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      - ../ComfyUI:/app
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - python
      - main.py
      - --listen
      - "0.0.0.0"
      - --port
      - "8188"
      - --preview-method
      - auto
      - --lowvram
      - --disable-smart-memory
      - --use-pytorch-cross-attention
    restart: unless-stopped
